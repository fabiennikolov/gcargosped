# nginx за gcargosped.com
#
# Сайтът живее на голия домейн — https://gcargosped.com. Това е адресът в
# APP_URL, адресът в canonical таговете, в sitemap.xml и в robots.txt.
#
# Всичко останало — www, http, http+www — се праща там с 301. Ако www отговаря
# с 200 (същото съдържание, различен адрес), Google има две еднакви страници и
# сам избира коя да индексира; така в Search Console се появи
# „Дубликат — Google избра различна канонична страница от потребителя“.
# Пренасочването е това, което премахва избора.
#
# Сложи файла като /etc/nginx/sites-available/gcargosped, линкни го в
# sites-enabled, и:
#   nginx -t && systemctl reload nginx
#
# ВАЖНО: не бива да остане друг server блок, който слуша за
# www.gcargosped.com — ако има такъв със `server_name gcargosped.com
# www.gcargosped.com;`, който сервира сайта, www продължава да отговаря с 200 и
# това тук няма ефект. Провери с:  grep -R server_name /etc/nginx/sites-enabled

# ---------------------------------------------------------------- http → https
server {
    listen      80;
    listen      [::]:80;
    server_name gcargosped.com www.gcargosped.com;

    # Certbot подновява сертификата по този път — той не се пренасочва.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://gcargosped.com$request_uri;
    }
}

# ------------------------------------------------------------- www → без www
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name www.gcargosped.com;

    # Същият сертификат — той трябва да покрива и двата домейна, иначе
    # браузърът показва предупреждение, преди изобщо да стигне до 301:
    #   certbot --nginx -d gcargosped.com -d www.gcargosped.com
    ssl_certificate     /etc/letsencrypt/live/gcargosped.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gcargosped.com/privkey.pem;

    return 301 https://gcargosped.com$request_uri;
}

# ----------------------------------------------------------------- самият сайт
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name gcargosped.com;

    root  /var/www/gcargosped-app/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/gcargosped.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gcargosped.com/privkey.pem;

    charset utf-8;
    client_max_body_size 20M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # robots.txt и sitemap.xml са маршрути в Laravel, не файлове — нищо тук не
    # бива да ги прихваща преди index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location ~ \.php$ {
        include        fastcgi_params;
        fastcgi_pass   unix:/run/php/php8.4-fpm.sock;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param  DOCUMENT_ROOT $realpath_root;

        # Laravel строи адресите от APP_URL, но сесиите и Filament се нуждаят
        # от истинската схема — без това всичко изглежда като http зад TLS.
        fastcgi_param  HTTPS on;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    # Кешираните бъндъли на Vite носят хеш в името си.
    location ~* \.(css|js|woff2?|svg|png|jpe?g|webp|avif|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php?$query_string;
    }

    location ~ /\.(?!well-known).* { deny all; }

    access_log /var/log/nginx/gcargosped.access.log;
    error_log  /var/log/nginx/gcargosped.error.log;
}
